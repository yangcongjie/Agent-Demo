[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demo"
version = "0.1.0"
description = "AI Agent Demo - 从零实现的工具调用 Agent"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
demo-chat = "demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]